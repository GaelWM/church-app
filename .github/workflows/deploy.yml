name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      environment: { description: "staging or production", default: staging }
concurrency: deploy-${{ inputs.environment || 'staging' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}   # production requires reviewer approval in GitHub settings
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Migrate database
        run: bun run --cwd packages/db migrate
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - name: Build web (static assets served by the Worker)
        run: bun run --cwd apps/web build
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      - name: Deploy Worker
        run: bunx wrangler deploy --env ${{ inputs.environment || 'staging' }}
        working-directory: apps/api
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
