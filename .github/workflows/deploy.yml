name: deploy
# push to main     -> production (the production environment should require reviewers in GitHub settings)
# push to staging  -> staging (automatic)
# manual run       -> staging or production, whichever you pick
on:
  push: { branches: [main, staging] }
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }}
  cancel-in-progress: false
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }}
    env:
      TARGET: ${{ inputs.environment || (github.ref_name == 'main' && 'production') || 'staging' }}
      # Owner (migration) credentials: DIRECT Neon URL. The Worker itself uses the app role via Hyperdrive.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check required secrets and variables for this environment
        run: |
          missing=0
          check() { if [ -z "$2" ]; then echo "::error::Missing $1 '$3' in GitHub → Settings → Environments → $TARGET"; missing=1; fi; }
          check secret   "$S_DATABASE_URL"         DATABASE_URL
          check secret   "$S_APP_DB_PASSWORD"      APP_DB_PASSWORD
          check secret   "$S_CF_TOKEN"             CLOUDFLARE_API_TOKEN
          check secret   "$S_CF_ACCOUNT"           CLOUDFLARE_ACCOUNT_ID
          check variable "$V_APP_URL"              APP_URL
          check variable "$V_AUTH0_DOMAIN"         AUTH0_DOMAIN
          check variable "$V_AUTH0_CLIENT_ID"      AUTH0_CLIENT_ID
          check variable "$V_AUTH0_AUDIENCE"       AUTH0_AUDIENCE
          [ "$missing" = 0 ] || { echo "See README → Go live → step 1 (GitHub)."; exit 1; }
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S_APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          S_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_APP_URL: ${{ vars.APP_URL }}
          V_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          V_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          V_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Migrate database (owner role)
        run: bun run --cwd packages/db migrate
      - name: Ensure the non-superuser app role and its grants (RLS depends on it)
        run: bun run --cwd packages/db grant
        env: { APP_DB_PASSWORD: "${{ secrets.APP_DB_PASSWORD }}" }
      - name: Seed categories (idempotent)
        run: bun run --cwd packages/db seed

      - name: Build web (static assets served by the Worker)
        run: bun run --cwd apps/web build
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}

      - name: Refuse to deploy with unresolved placeholders or missing bindings
        working-directory: apps/api
        run: |
          bunx wrangler deploy --dry-run --env "$TARGET" --outdir /tmp/wrangler-out | tee /tmp/dry-run.txt
          if grep -q REPLACE_ME /tmp/dry-run.txt; then echo "::error::wrangler.jsonc still contains REPLACE_ME for $TARGET"; exit 1; fi
          for b in HYPERDRIVE KV FILES EMAIL AUTH0_DOMAIN AUTH0_AUDIENCE APP_URL MAIL_FROM; do
            grep -q "env.$b" /tmp/dry-run.txt || { echo "::error::binding $b missing for $TARGET"; exit 1; }
          done
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: Deploy Worker
        working-directory: apps/api
        run: bunx wrangler deploy --env "$TARGET"
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }

      - name: Smoke test the deployed environment
        run: bun run smoke "${{ vars.APP_URL }}"
