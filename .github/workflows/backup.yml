name: nightly-backup
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install matching pg_dump
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Dump and upload to R2 (independent of Neon's own restore window)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: |
          f="church-$(date -u +%F).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner | gzip > "$f"
          aws s3 cp "$f" "s3://$R2_BACKUP_BUCKET/$f" --endpoint-url "$R2_ENDPOINT"
