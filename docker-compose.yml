# Local Postgres for development. Superuser "postgres" runs migrations; the API connects as
# the non-superuser "app_user" so row-level security applies exactly as in production.
services:
  db:
    image: postgres:16-alpine
    container_name: church-dev-pg
    environment: { POSTGRES_PASSWORD: pw, POSTGRES_DB: church }
    ports: ["54320:5432"]
    volumes: [church-dev-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d church"], interval: 3s, retries: 20 }
volumes:
  church-dev-data:
